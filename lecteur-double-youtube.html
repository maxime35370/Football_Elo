<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur double synchronisé</title>
<style>
  :root { --bg:#0f1419; --panel:#182028; --line:#2a3642; --fg:#e8eef4; --muted:#8fa1b3; --accent:#3fb6ff; --ok:#3ddc97; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .players { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:800px){ .players{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; min-width:0; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; }
  .frame > div, .frame iframe { position:absolute; inset:0; width:100%; height:100%; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
  input[type=text] { background:#0f1419; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 8px; min-width:0; }
  input.url { flex:1 1 220px; }
  input.time { width:90px; text-align:center; font-variant-numeric:tabular-nums; }
  button { background:#223040; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  label { color:var(--muted); }
  .cur { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .cur b { color:var(--fg); }
  .master { margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; bottom:8px; }
  .master button.big { font-size:16px; padding:10px 18px; }
  .primary { background:var(--accent); color:#04141f; border-color:var(--accent); font-weight:600; }
  .sep { width:1px; align-self:stretch; background:var(--line); }
  select { background:#0f1419; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px; }
  .hint { color:var(--muted); font-size:12px; margin-top:10px; }
  .err { color:#ff7b7b; }
</style>
</head>
<body>
<h1>Lecteur double synchronisé</h1>

<div class="players">
  <section class="panel" data-i="0">
    <div class="frame"><div id="p0"></div></div>
    <div class="row">
      <input class="url" id="url0" type="text" placeholder="Lien YouTube vidéo A" aria-label="Lien vidéo A">
      <button data-act="load">Charger</button>
    </div>
    <div class="row">
      <label for="st0">Départ</label>
      <input class="time" id="st0" type="text" value="0:00" aria-label="Instant de départ vidéo A">
      <button data-act="goStart">Aller au départ</button>
      <button data-act="mark" title="Utiliser l'instant actuel comme départ">Départ = ici</button>
      <span class="cur">actuel <b id="cur0">0:00.0</b></span>
    </div>
    <div class="row">
      <label>Ajuster</label>
      <button data-nudge="-5">−5 s</button><button data-nudge="-1">−1 s</button><button data-nudge="-0.1">−0,1</button>
      <button data-nudge="0.1">+0,1</button><button data-nudge="1">+1 s</button><button data-nudge="5">+5 s</button>
    </div>
    <div class="err" id="err0"></div>
  </section>

  <section class="panel" data-i="1">
    <div class="frame"><div id="p1"></div></div>
    <div class="row">
      <input class="url" id="url1" type="text" placeholder="Lien YouTube vidéo B" aria-label="Lien vidéo B">
      <button data-act="load">Charger</button>
    </div>
    <div class="row">
      <label for="st1">Départ</label>
      <input class="time" id="st1" type="text" value="0:00" aria-label="Instant de départ vidéo B">
      <button data-act="goStart">Aller au départ</button>
      <button data-act="mark" title="Utiliser l'instant actuel comme départ">Départ = ici</button>
      <span class="cur">actuel <b id="cur1">0:00.0</b></span>
    </div>
    <div class="row">
      <label>Ajuster</label>
      <button data-nudge="-5">−5 s</button><button data-nudge="-1">−1 s</button><button data-nudge="-0.1">−0,1</button>
      <button data-nudge="0.1">+0,1</button><button data-nudge="1">+1 s</button><button data-nudge="5">+5 s</button>
    </div>
    <div class="err" id="err1"></div>
  </section>
</div>

<div class="master">
  <button class="big primary" id="playpause">▶ Play</button>
  <button id="startBoth">⏮ Les deux au départ</button>
  <span class="sep"></span>
  <button id="back">⏪ Reculer</button>
  <label for="delta" class="sr">de</label>
  <select id="delta" aria-label="Valeur du recul">
    <option>1</option><option>2</option><option selected>5</option><option>10</option><option>15</option><option>30</option><option>60</option>
  </select> s
  <button id="fwd">Avancer ⏩</button>
  <span class="sep"></span>
  <label for="rate">Vitesse</label>
  <select id="rate">
    <option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option>
  </select>
</div>
<div class="hint">Raccourcis : Espace = Play/Pause · ← / → = reculer / avancer du delta choisi. Les deux vidéos bougent du même delta, chacune depuis sa position actuelle.</div>

<script>
(function () {
  var players = [null, null], ready = [false, false], playing = false, pendingPause = [false, false];

  function parseTime(s) {
    s = String(s).trim();
    if (!s) return 0;
    if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    var m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s?)?$/i);
    if (m && (m[1] || m[2] || m[3])) return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    var p = s.split(':').map(parseFloat);
    if (p.some(isNaN)) return 0;
    return p.reduce(function (a, v) { return a * 60 + v; }, 0);
  }
  function fmt(t, dec) {
    t = Math.max(0, t);
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    var ss = dec ? s.toFixed(1).padStart(4, '0') : String(Math.floor(s)).padStart(2, '0');
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + ss;
  }
  function parseUrl(u) {
    var id = null, t = 0;
    try {
      var url = new URL(u.trim());
      if (url.hostname.indexOf('youtu.be') >= 0) id = url.pathname.slice(1);
      else if (url.pathname.indexOf('/embed/') === 0 || url.pathname.indexOf('/shorts/') === 0 || url.pathname.indexOf('/live/') === 0) id = url.pathname.split('/')[2];
      else id = url.searchParams.get('v');
      var tp = url.searchParams.get('t') || url.searchParams.get('start');
      if (tp) t = parseTime(tp);
    } catch (e) {
      if (/^[\w-]{11}$/.test(u.trim())) id = u.trim();
    }
    return { id: id, t: t };
  }
  function startOf(i) { return parseTime(document.getElementById('st' + i).value); }
  function setStart(i, t) { document.getElementById('st' + i).value = fmt(t, t % 1 !== 0); }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    [0, 1].forEach(function (i) {
      players[i] = new YT.Player('p' + i, {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin && location.origin !== 'null' ? location.origin : undefined },
        events: {
          onReady: function () { ready[i] = true; },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING && pendingPause[i]) {
              pendingPause[i] = false;
              players[i].pauseVideo();
              players[i].seekTo(startOf(i), true);
            }
          },
          onError: function (e) {
            document.getElementById('err' + i).textContent = 'Erreur YouTube (' + e.data + ') : vidéo indisponible ou intégration interdite.';
          }
        }
      });
    });
  };

  function loadVideo(i) {
    var r = parseUrl(document.getElementById('url' + i).value);
    var err = document.getElementById('err' + i);
    err.textContent = '';
    if (!r.id) { err.textContent = 'Lien YouTube non reconnu.'; return; }
    if (!ready[i]) { err.textContent = 'Lecteur pas encore prêt, réessayez dans une seconde.'; return; }
    if (r.t) setStart(i, r.t);
    pendingPause[i] = true;
    players[i].loadVideoById({ videoId: r.id, startSeconds: startOf(i) });
    setPlaying(false);
  }
  function seekTo(i, t) { if (ready[i] && players[i].seekTo) players[i].seekTo(Math.max(0, t), true); }
  function cur(i) { return ready[i] && players[i].getCurrentTime ? players[i].getCurrentTime() : 0; }

  function setPlaying(v) {
    playing = v;
    document.getElementById('playpause').textContent = v ? '⏸ Pause' : '▶ Play';
  }
  function playBoth() { players.forEach(function (p, i) { if (ready[i] && p.playVideo) p.playVideo(); }); setPlaying(true); }
  function pauseBoth() { players.forEach(function (p, i) { if (ready[i] && p.pauseVideo) p.pauseVideo(); }); setPlaying(false); }
  function toggle() { playing ? pauseBoth() : playBoth(); }
  function delta() { return parseFloat(document.getElementById('delta').value); }
  function shift(sign) { var d = delta() * sign; [0, 1].forEach(function (i) { seekTo(i, cur(i) + d); }); }

  document.querySelectorAll('.panel').forEach(function (panel) {
    var i = +panel.dataset.i;
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'load') loadVideo(i);
      else if (b.dataset.act === 'goStart') seekTo(i, startOf(i));
      else if (b.dataset.act === 'mark') setStart(i, cur(i));
      else if (b.dataset.nudge) {
        var t = Math.max(0, startOf(i) + parseFloat(b.dataset.nudge));
        setStart(i, Math.round(t * 10) / 10);
        seekTo(i, t);
      }
    });
    panel.querySelector('input.url').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadVideo(i); });
    panel.querySelector('input.time').addEventListener('change', function () { seekTo(i, startOf(i)); });
  });

  document.getElementById('playpause').onclick = toggle;
  document.getElementById('back').onclick = function () { shift(-1); };
  document.getElementById('fwd').onclick = function () { shift(1); };
  document.getElementById('startBoth').onclick = function () { [0, 1].forEach(function (i) { seekTo(i, startOf(i)); }); };
  document.getElementById('rate').onchange = function (e) {
    players.forEach(function (p, i) { if (ready[i] && p.setPlaybackRate) p.setPlaybackRate(parseFloat(e.target.value)); });
  };
  document.addEventListener('keydown', function (e) {
    var tgt = e.target.tagName;
    if (tgt === 'INPUT' || tgt === 'SELECT' || tgt === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); shift(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); shift(1); }
  });

  setInterval(function () {
    [0, 1].forEach(function (i) { document.getElementById('cur' + i).textContent = fmt(cur(i), true); });
  }, 100);
})();
</script>
</body>
</html>
